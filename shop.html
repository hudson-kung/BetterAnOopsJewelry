<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop | BetterAnOops</title>
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="BetterAnOops home">
        <img class="brand-logo" src="Cell_welcome_IMAGE.png" alt="Better An Oops" />
      </a>
      <button class="nav-toggle" type="button" aria-label="Open navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="site-nav" aria-label="Primary navigation">
        <a href="index.html">Home</a>
        <a href="shop.html" aria-current="page">Shop</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main>
      <section class="page-hero">
        <p class="eyebrow">Shop</p>
        <h1>No products are listed right now.</h1>
      </section>

      <section class="section shop-section">
        <div class="empty-cart shop-empty">
          <h2>No products are listed right now.</h2>
          <p>BetterAnOops inventory has been cleared.</p>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <span>BetterAnOops</span>
      <span>Reasonable jewelry for brighter everyday style.</span>
    </footer>
    <a class="floating-cart" href="cart.html" aria-label="Shopping cart">
      <span class="cart-icon" aria-hidden="true"></span>
      <span id="bagCount">0</span>
    </a>
    <div class="toast" id="toast" role="status" aria-live="polite">Added to bag</div>
    <script src="script.js"></script>
  </body>
</html>
